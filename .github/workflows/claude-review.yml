name: Claude Review

# Reviews a PR once when it's opened ready for review or leaves draft.
# Pushes to an open PR don't re-trigger it; ask @claude for a re-review.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a PR for tadjh.com, a personal portfolio site.
            Stack: Astro 7 (Netlify adapter), React islands, Tailwind 4, MDX content
            collections, TypeScript (strict), pnpm, Node 22.
            CI already runs `pnpm format:check`, `pnpm test:coverage` (Vitest) and
            `pnpm build` (which includes `astro check`), so don't comment on
            formatting or type errors CI will catch. Do flag new logic in
            `src/utils/` or `src/pages/**/*.ts` that ships without a test.

            Read the diff with `gh pr diff`, then open the surrounding files when you
            need context. Only report problems you can point to in the changed lines
            or that the change directly causes. Don't speculate.

            Look for, in priority order:

            1. Bugs: broken links or routes, wrong imports, hydration mismatches,
               SSR-unsafe code (`window`/`document` outside `useEffect` or client-only
               code), content that won't render, and regressions to `rss.xml.js`,
               `robots.txt.ts`, the sitemap filter or the `/p/[shortlink]` redirects.
            2. Performance (this site has had a lot of CLS and load-time tuning):
               - Images and video without explicit width/height or aspect ratio (layout shift).
               - Images not going through `astro:assets` (`<Image>`/`<Picture>`) or
                 oversized source assets added under `src/assets/`.
               - Heavy libraries (three, framer-motion, canvas-confetti) imported in
                 Astro frontmatter or eagerly, rather than in a lazily hydrated island.
               - `client:load` where `client:visible` or `client:idle` would do.
               - New fonts or render-blocking scripts or styles.
            3. Accessibility: missing or meaningless alt text, non-semantic interactive
               elements, missing labels on icon-only buttons and links, focus handling
               in menus and modals, `prefers-reduced-motion` for new animations, and
               contrast in both light and dark mode (`darkMode: "selector"`).
            4. Content: project MDX frontmatter must match the zod schema in
               `src/content.config.ts`. Unfinished projects should use `draft: true`.
               Check `hero`, `pubDate` and any `repository`/`website` URLs.
            5. SEO/meta: titles, descriptions and canonical/OG data in `BaseHead.astro`
               for new pages.

            How to report:
            - One inline comment per real issue, on the exact line. Start it with a
              severity: **Blocker** (breaks the site or build), **Should fix**, or
              **Nit**. Say what's wrong, why it matters here, and give a concrete fix
              (a suggestion block when it's small).
            - Keep Nits to a minimum. Skip taste-only preferences.
            - Finish with one short top-level comment: a one-line verdict
              (Looks good / Fix before merging), then a bullet per Blocker or Should
              fix. If you found nothing worth flagging, say so in one line. Don't
              summarize what the PR does.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
