name: Claude Review

# Reviews a PR once when it's opened ready for review or leaves draft.
# Pushes to an open PR don't re-trigger it; ask @claude for a re-review.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for tadjh.com, an Astro 4 + React + Tailwind 3 + MDX
            portfolio deployed on Netlify. Focus on:

            1. Correctness and anything that would break `pnpm build` (which runs `astro check`).
            2. Performance: layout shift (CLS), image and video sizes, lazy loading,
               and keeping heavy libraries (three, framer-motion) inside client islands.
            3. Accessibility: semantic HTML, alt text, contrast, keyboard navigation.
            4. Content: project MDX frontmatter must match `src/content/config.ts`.

            Use inline comments for specific issues and one top-level comment for a
            short summary. Skip style nits that Prettier already enforces.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
